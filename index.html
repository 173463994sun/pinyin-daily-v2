function currentSession(){return profile().activeSession;}
function dueIssues(){return Object.values(profile().issues).filter(i=>i.nextDue&&i.nextDue<=day()&&['monitoring','repaired_today','closed','suspected_regression','active','reopened','repairing'].includes(i.status));}

function listeningChoices(s){let contrast=s;if(/^[bp]/.test(s))contrast=(s[0]==='b'?'p':'b')+s.slice(1);else if(/^[nl]/.test(s))contrast=(s[0]==='n'?'l':'n')+s.slice(1);else if(/ang$/.test(s))contrast=s.slice(0,-1);else if(/an$/.test(s))contrast=s+'g';else if(/eng$/.test(s))contrast=s.slice(0,-1);else if(/en$/.test(s))contrast=s+'g';else if(/ing$/.test(s))contrast=s.slice(0,-1);else if(/in$/.test(s))contrast=s+'g';return [s,contrast,...['ma','ta','la','ba','an','ang','en','eng'].filter(x=>x!==s&&x!==contrast)].filter((x,n,a)=>a.indexOf(x)===n).slice(0,4);}

function makeTask(kind,s='ba',tone=3,phase='learn',tag=null,issueId=null){let t={id:uid(),kind,s,tone,phase,tag,issueId,knowledgeId:s,materialId:s,capability:'recognition',supportLevel:0,heard:0,answered:false};
if(kind==='recognition'){t.target=s;t.expected=s;t.options=s==='b'?['b','p','d','q']:s==='p'?['p','b','d','q']:['a','o','e','i'];t.prompt='读出门上的符号，再找到相同的朋友';t.tag=tag||'recognition_failure';t.exposureOnly=true;}
if(kind==='blending'){let initial=['zh','ch','sh',...Object.keys(combos).filter(x=>x)].find(x=>s.startsWith(x))||'';let final=s.slice(initial.length);if(['j','q','x'].includes(initial)&&final.startsWith('u'))final='ü'+final.slice(1);t.target=initial+' + '+final;t.expected=s;t.options=[s,...['ba','ma','pa','da','ta','na','la'].filter(x=>x!==s).slice(0,3)];t.prompt='把两块声音石合在一起';t.capability='blending';t.tag=tag||'blending_breakdown';}
if(kind==='marking'){t.target=s+' · 第'+['','一','二','三','四'][tone]+'声';t.expected=applyToneMark(s,tone);let correct=t.expected,base=normalizePinyin(s);t.options=[correct,...[...base].map((v,i)=>MARKS[v]?base.slice(0,i)+MARKS[v][tone-1]+base.slice(i+1):null).filter(x=>x&&x!==correct),applyToneMark(s,tone===3?2:3),base].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);t.prompt='把声调帽子戴在正确的位置';t.capability='toneMarking';t.tag=tag||'tone_mark_position';}
if(kind==='listening'||kind==='tone'){t.expected=kind==='tone'?applyToneMark(s,tone):s;t.target='♪';t.options=kind==='tone'?getToneVariants(s):listeningChoices(s);t.prompt='听声音，找到魔法钥匙';t.capability=kind==='tone'?'toneListening':'listening';t.tag=tag||(kind==='tone'?'tone_2_3_confusion':s==='ba'?'bp_listening_confusion':s==='na'?'nl_listening_confusion':s==='an'?'an_ang_listening_confusion':'en_eng_listening_confusion');}
if(kind==='read'){t.expected=applyToneMark(s,tone);t.target=t.expected;t.options=[];t.prompt='把这句魔法读给星铃听';t.capability='toneProduction';t.tag=tag||'tone_production';}
if(kind==='write'||kind==='dictation'){t.expected=applyToneMark(s,tone);t.target=kind==='dictation'?'♪':t.expected;t.options=[];t.prompt=kind==='dictation'?'听声音，在格子里写下来':'在格子里写下这句魔法';t.capability=kind==='dictation'?'dictation':'handwriting';t.tag=tag||'handwriting_failure';}
// No fixed answer positions.
t.options=t.options.sort(()=>Math.random()-.5);return t;}
function baseForIssue(i,s,phase){let kind=i.capability==='toneMarking'?'marking':i.capability==='blending'?'blending':i.capability==='toneListening'?'tone':i.capability==='listening'?'listening':i.capability==='toneProduction'?'read':i.capability==='handwriting'?'write':'recognition';return makeTask(kind,s,i.issueId==='tone_1_2_confusion'?2:3,phase,i.issueId,i.issueId);}
function baseTask(){let s=currentSession();if(!s)return home();let t=s.tasks[s.index];taskState=t;if(!t)return completion();let phaseLabel={learn:'探索森林',teach:'星铃的小窍门',scaffold:'一起修好小桥',verify:'试试新的魔法',delayed:'找回昨天的星星',review:'守护旧魔法',parent_verify:'新的声音线索',final:'星光守护关',final_delayed:'守护昨日星光'}[t.phase];let listen=['tone','listening','dictation','symbol'].includes(t.kind);let needsAdult=listen&&profile().audioSource==='adult';return `<div class="row between"><span class="task-head">${phaseLabel} · ${s.index+1} / ${s.tasks.length}</span><button class="quiet" onclick="pauseAdventure()">休息一下</button></div><div class="progress"><i style="width:${s.index/s.tasks.length*100}%"></i></div><div class="card"><div class="row"><span style="font-size:32px">🦄</span><p>“${esc(t.prompt)}，<br>我们就能再走一步！”</p></div><div class="target">${esc(t.target)}</div>${t.phase==='teach'?`<div class="help">${teaching(t)}</div><button class="primary" onclick="finishTeaching()">和星铃一起试一试 →</button>`:`${listen?`<button class="primary" onclick="playTask()" ${t.answered?'disabled':''}>${needsAdult?'请家长读一次声音':'▶ 听魔法声音'}</button>${needsAdult?'<p class="small muted">把屏幕暂交家长，读完再交回。</p>':'<p class="small muted">播放真人音节参考录音。</p>'}`:''}${['read','soundRead'].includes(t.kind)?`<div class="row"><button class="grow" id="recordButton" onclick="toggleRecording()">● 录下我的声音</button>${!['verify','delayed','final','final_delayed'].includes(t.phase)?'<button class="secondary" onclick="playTask()">听一次示范</button>':''}</div><div id="audioArea">${recordURL?'<audio controls src="'+recordURL+'"></audio>':''}</div><p class="small muted">也可以直接读给家长听。</p><button class="primary" onclick="askAdultReview()" ${t.answered?'disabled':''}>我读好了，请家长听一听</button>`:t.kind==='write'||t.kind==='dictation'?`<canvas id="writing" width="720" height="320" aria-label="拼音书写区"></canvas><div class="row" style="margin:12px 0"><button class="quiet" onclick="clearCanvas()">重新写</button><button class="grow" onclick="askAdultReview()" ${t.answered?'disabled' function baseTeaching(t){if(t.capability==='toneMarking')return '声调帽子先找 a，没有 a 找 o、e；遇到 iu、ui，戴在后一个元音上。i 戴帽子要去掉点。例：liú、guǐ。j、q、x、y 后面，ü 的两点要省掉。';if(t.capability==='toneListening'||t.capability==='toneProduction')return '二声像上小坡 ↗，三声先降下去再升起来 ↘↗。请家长分别读 bá、bǎ，配合手势；你来指一指哪条声音路线先往下走。';if(t.capability==='blending')return '先轻轻读前面的声母，再读后面的韵母，连成一个声音。请家长示范 b—ā → bā；你来把两块声音石连起来。';if(t.capability==='listening')return '只比较这两个声音。请家长慢慢读一次，让你听清不同：b / p 看气流是否明显，an / ang 听结尾在哪里停。再换一个声音试试。';if(t.capability==='handwriting'||t.capability==='dictation')return '先看清字母住在哪一格，再写字母，最后检查声调帽子。请家长用四线三格示范一次，再由你自己写。';return '先看竖线，再看圆圈在哪一边。b 的圆圈在右下，d 的圆圈在左下，p 的圆圈在右上。请家长指一个，你来找出不同。';}
function pauseAdventure(){if(recording){toast('请先结束录音。');return;}save();setView('home');}

function clearCanvas(){let c=document.getElementById('writing');c?.getContext('2d').clearRect(0,0,c.width,c.height);drawHasInk=false;taskState.ink=null;save();}
function initCanvas(){let c=document.getElementById('writing');if(!c)return;drawHasInk=!!taskState.ink;let ctx=c.getContext('2d');ctx.strokeStyle='#196d5e';ctx.lineWidth=5;ctx.lineCap='round';if(taskState.ink){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=taskState.ink;}let down=false;function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];}c.onpointerdown=e=>{if(taskState.answered)return;down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));};c.onpointermove=e=>{if(!down)return;ctx.lineTo(...point(e));ctx.stroke();drawHasInk=true;};c.onpointerup=c.onpointercancel=()=>{if(!down)return;down=false;taskState.ink=c.toDataURL();save();};}

const RECORDING_BASE='https://www.sreading.org/pinyin/';
let referenceAudio=null,referenceBusy=false;
function recordingKey(target){let s=String(target).toLowerCase().trim().normalize('NFC');if(!/^[a-züāáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜ]+$/.test(s))return null;if(TEACHING_AUDIO_KEYS.has(s))return s;const base=stripTone(s);if(s===base&&VALID.has(base)){const first=applyToneMark(base,1);if(TEACHING_AUDIO_KEYS.has(first))return first;}return null;}
function speakPinyin(target){if(audioAdapter)return audioAdapter(target);const key=recordingKey(target);if(!key){toast('这个声音暂无对应真人录音，请家长示范；不会改用字母合成音。');return Promise.resolve(false);}if(referenceBusy)return Promise.resolve(false);referenceBusy=true;toast('正在播放拼音教学录音');return new Promise(resolve=>{const audio=new Audio(RECORDING_BASE+encodeURIComponent(key)+'.mp3');referenceAudio=audio;let settled=false;const timer=setTimeout(()=>done(false),18000);function done(ok){if(settled)return;settled=true;clearTimeout(timer);audio.pause();referenceBusy=false;referenceAudio=null;if(!ok)toast('教学录音暂时无法播放，请重试或请家长读音。');else toast('读音播放完成');resolve(ok?{played:true,reliable:false,source:'human_reference',key}:false);}audio.onended=()=>done(true);audio.onerror=()=>done(false);audio.play().catch(()=>done(false));});}
async function playTask(){let t=taskState;if(t.answered)return;if(['read','soundRead'].includes(t.kind)&&['verify','delayed','final','final_delayed'].includes(t.phase)){toast('这一关请独立读音，完成后由家长确认。');return;}let auditory=['tone','listening','dictation','symbol'].includes(t.kind);if((profile().audioSource==='adult'||!recordingKey(t.audioTarget||t.expected))&&auditory){adultAudioDialog(t);return;}if(['read','soundRead'].includes(t.kind))t.supportLevel=Math.max(t.supportLevel,4);else if(t.heard)t.supportLevel=Math.max(t.supportLevel,1);let ok=await speakPinyin(t.audioTarget||t.expected);if(ok&&taskState===t&&!t.answered){t.heard++;if(auditory)t.audioQuality=ok?.reliable===true&&ok?.played===true?'standard':ok?.source==='human_reference'?'reference':'demo';if(ok?.source==='human_reference')t.recordingKey=ok.key;save();if(auditory)render();}}
function dialog(html){let d=document.createElement('dialog');d.style.cssText='border:0;border-radius:24px;max-width:420px;width:90%;padding:24px;color:#263c3b';d.innerHTML=html;document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal();return d;}
function adultAudioDialog(t){let d=dialog(`<h2>请家长读音</h2><p class="muted">不要让孩子看见下面的答案。按普通话规范读一次，再把屏幕交回。</p><div class="target">${esc(t.audioTarget||t.expected)}</div><p class="small">声母要用教学读音；不要用英文字母读音。不能确认规范读音时，取消；不要用英文字母读音替代。</p><div class="row"><button class="primary" id="confirmAudio">已规范读音</button><button class="secondary" id="cancelAudio">取消</button></div>`);d.querySelector('#confirmAudio').onclick=()=>{if(t.heard)t.supportLevel=Math.max(t.supportLevel,1);t.heard++;t.audioQuality='adult';save();d.close();render();};d.querySelector('#cancelAudio').onclick=()=>d.close();}
async function toggleRecording(){if(recording){recording.stop();return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('当前浏览器无法录音，可以直接读给家长听；需要录音时请用 localhost 或 HTTPS 打开。');return;}try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recording=new MediaRecorder(recordStream);let chunks=[];recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recording.onstop=()=>{recordProcessing=true;const recordedTask=taskState;clearTimeout(recordTimer);recordBlob=new Blob(chunks,{type:recording.mimeType});if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(recordBlob);recordStream.getTracks().forEach(t=>t.stop());recordStream=null;recording=null;let reader=new FileReader();reader.onload=()=>{recordProcessing=false;if(recordedTask){recordedTask.recordingURI=reader.result;save();}};reader.onerror=()=>{recordProcessing=false;toast('录音保存失败，可以直接读给家长确认。');};reader.readAsDataURL(recordBlob);document.getElementById('recordButton').classList.remove('recording');document.getElementById('recordButton').textContent='● 再录一次';document.getElementById('audioArea').innerHTML=`<audio controls src="${recordURL}"></audio><button class="quiet" onclick="downloadRecording()">保存这段录音</button><p class="small muted">3 秒录音已随本地进度保存，也可单独下载。</p>`;};recording.start();document.getElementById('recordButton').classList.add('recording');document.getElementById('recordButton').textContent='■ 录音中 · 3 秒自动结束';recordTimer=setTimeout(()=>recording?.stop(),3000);save();}catch(e){recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;toast('没有取得麦克风权限。可以直接读给家长听，再由家长确认。');}}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function downloadRecording(){if(recordBlob)downloadBlob(recordBlob,'拼音录音-'+day()+(recordBlob.type.includes('mp4')?'.m4a':'.webm'));}
function askAdultReview(){if(recordProcessing){toast('录音正在保存，请稍等。');return;}if(recording){toast('请先结束录音。');return;}let t=taskState;if(['write','dictation'].includes(t.kind)&&!drawHasInk){toast('先在格子里写一写，也可以跳过这次。');return;}let d=dialog(`<h2>请家长确认这次表现</h2><p>目标：<b>${esc(t.expected)}</b></p><p class="muted">${['read','soundRead'].includes(t.kind)?'请听实际读音，不能仅根据孩子说“读好了”判正确。':'请查看字母形状、四线三格位置、顺序与调号。首版没有自动手写识别。'}</p><label>孩子获得的帮助</label><select id="reviewSupport">${['完全独立','重听一次','二选一','规则提示','成人示范后模仿'].map((x,i)=>`<option value="${i}" ${i===t.supportLevel?'selected':''}>${i} · ${x}</option>`).join('')}</select><label>简短观察（可选）</label><textarea id="reviewNote" placeholder="例如：先读成二声，自己改成三声"></textarea><div class="row" style="margin-top:16px"><button id="adultRight">正确</button><button id="adultWrong">还没完成</button><button id="adultUnknown" class="quiet">无法判断</button></div>`);let finish=result=>{t.supportLevel=Math.max(t.supportLevel,+d.querySelector('#reviewSupport').value);let note=d.querySelector('#reviewNote').value.trim().slice(0,500);d.close();submit(t,result,['read','soundRead'].includes(t.kind)?'口述':'手写','parent',note);};d.querySelector('#adultRight').onclick=()=>finish('correct');d.querySelector('#adultWrong').onclick=()=>finish('wrong');d.querySelector('#adultUnknown').onclick=()=>finish('unverified');}
function answer(o){let t=taskState;if(t.answered)return;if(['tone','listening','symbol'].includes(t.kind)&&!t.heard)return;submit(t,o===t.expected?'correct':'wrong',o,'web','');}
function skipTask(){let t=taskState;if(t.answered)return;submit(t,'skipped','','web','');}
function errorTag(t,selected){if(t.kind==='marking'){let toneOf=x=>{for(let marks of Object.values(MARKS)){for(let n=0;n<4;n++)if(x.includes(marks[n]))return n+1;}return 0;};if(toneOf(selected)!==toneOf(t.expected))return 'tone_symbol_mapping';return 'tone_mark_position';}if(t.kind==='tone'){let variants=getToneVariants(t.s),a=variants.indexOf(t.expected)+1,b=variants.indexOf(selected)+1;let pair=[a,b].sort().join('_');if(['2_3','1_2','3_4'].includes(pair))return 'tone_'+pair+'_confusion';return 'tone_symbol_mapping';}if(t.kind==='recognition'&&['b','p'].includes(t.s)&&['b','p'].includes(selected))return 'bp_visual_confusion';if(t.kind==='recognition'&&['b','d'].includes(t.s)&&['b','d'].includes(selected))return 'bd_visual_confusion';return t.tag;}
function baseRecordEvidence(t,result,selected,source='web',note=''){let auditory=['tone','listening','dictation','symbol'].includes(t.kind);let e={evidenceId:uid(),profileId:profile().id,date:day(),timestamp:new Date().toISOString(),sessionId:currentSession()?.id,target:t.audioTarget||t.expected,knowledgeId:t.knowledgeId,materialId:t.materialId,capability:t.capability,taskType:t.kind,phase:t.phase,result,selected,expected:t.expected,supportLevel:t.supportLevel,source:source||'teaching',demoScore:!!profile().isDemo||(auditory&&!['adult','standard'].includes(t.audioQuality)),audioSource:auditory?(t.audioQuality==='adult'?'parent_confirmed':t.audioQuality==='standard'?'standard_recording':t.audioQuality==='reference'?'human_reference':'browser_demo'):null,errorTag:result==='wrong'?errorTag(t,selected):t.issueId||null,issueId:t.issueId,note,handwriting:t.ink||null,recordingSaved:!!t.recordingURI,recordingURI:t.recordingURI||null,synthetic:!!profile().isDemo,validForMastery:!t.exposureOnly};profile().evidence.push(e);if((!e.demoScore||profile().isDemo)&&!t.exposureOnly&&['correct','wrong'].includes(result)){updateDiagnosis(profile(),e);if(t.issueId)updateVerification(profile(),e);scheduleReview(profile(),e);}save();return e;}
function baseUpdateDiagnosis(p,e){let tag=e.result==='wrong'?e.errorTag:e.issueId;let i=tag?p.issues[tag]:null;if(e.result==='wrong'&&!i){i=p.issues[tag]={issueId:tag,label:TAGS[tag]||tag,domain:e.capability.includes('tone')?'tone':'pinyin',capability:e.capability,relatedKnowledge:[],status:'candidate',priorityScore:0,independentFailCount:0,independentPassCount:0,supportedPassCount:0,firstSeenDate:e.date,lastSeenDate:e.date,repairHistory:[],verificationHistory:[],reopenCount:0,nextDue:null};}if(!i)return;i.lastSeenDate=e.date;if(e.result==='wrong'){if(e.supportLevel===0)i.independentFailCount++;if(!i.relatedKnowledge.includes(e.knowledgeId))i.relatedKnowledge.push(e.knowledgeId);if(i.status==='closed'){i.status='suspected_regression';i.nextDue=addDays(e.date,1);i.regressionStart=e.timestamp;}}
else if(e.supportLevel===0)i.independentPassCount++;else i.supportedPassCount++;
let errors=p.evidence.filter(x=>(!x.demoScore||p.isDemo)&&x.result==='wrong'&&x.supportLevel===0&&x.errorTag===i.issueId);let days=new Set(errors.map(x=>x.date)).size;let materials=new Set(errors.map(x=>x.materialId)).size;let recent=p.evidence.filter(x=>(!x.demoScore||p.isDemo)&&['correct','wrong'].includes(x.result)&&x.supportLevel===0&&x.capability===i.capability).slice(-2);let consecutive=recent.length===2&&recent.every(x=>x.result==='wrong'&&x.errorTag===i.issueId);let parentMatch=errors.some(x=>x.source==='parent')&&errors.some(x=>x.source==='web');i.priorityScore=(days>=2?3:0)+(materials>=2?2:0)+(consecutive?2:0)+(parentMatch?2:0)+(i.reopenCount?2:0);if(i.status==='candidate'&&errors.length>=2&&(consecutive||days>=2||materials>=2||parentMatch))i.status='active';}
function updateVerification(p,e){let i=p.issues[e.issueId];if(!i||!['verify','delayed'].includes(e.phase)||(e.demoScore&&!p.isDemo))return;i.verificationHistory.push({evidenceId:e.evidenceId,date:e.date,materialId:e.materialId,result:e.result,supportLevel:e.supportLevel,phase:e.phase});if(e.result==='wrong'){if(e.phase==='delayed'){i.status='reopened';i.reopenCount++;}else i.status='active';i.nextDue=addDays(e.date,1);return;}if(e.supportLevel>0)return;let phasePass=i.verificationHistory.filter(x=>x.date===e.date&&x.phase===e.phase&&x.result==='correct'&&x.supportLevel===0);let fresh=new Set(phasePass.filter(x=>!i.relatedKnowledge.includes(x.materialId)).map(x=>x.materialId));let recent=i.verificationHistory.filter(x=>x.date===e.date&&x.phase===e.phase);if(fresh.size<2||recent.some(x=>x.result==='wrong'||x.supportLevel>0))return;
if(e.phase==='verify'){i.status='repaired_today';i.repairHistory.push({date:e.date,evidenceIds:phasePass.map(x=>x.evidenceId),method:'minimal_contrast_and_fade'});i.nextDue=addDays(e.date,1);}else{let lastRepair=i.repairHistory.at(-1);if(!lastRepair||e.date<=lastRepair.date)return;i.status='closed';i.nextDue=addDays(e.date,4);}}
function baseNextTask(){let s=currentSession();s.index++;taskState=null;recordBlob=null;if(recordURL){URL.revokeObjectURL(recordURL);recordURL=null;}save();render();}
function baseMastery(p,capability){let all=p.evidence.filter(e=>e.capability===capability&&(!e.demoScore||p.isDemo)&&e.validForMastery!==false);if(!all.length)return {label:'尚未观察',level:0};let recent=all.filter(e=>['correct','wrong'].includes(e.result)).slice(-6);let pass=recent.filter(e=>e.result==='correct'&&e.supportLevel===0);let ds=new Set(pass.map(e=>e.date));let ms=new Set(pass.map(e=>e.materialId));let open=Object.values(p.issues).some(i=>i.capability===capability&&['active','repairing','reopened'].includes(i.status));if(open)return {label:'正在修复',level:1};if(pass.length>=5&&ds.size>=3&&ms.size>=3&&recent.every(e=>e.result==='correct'&&e.supportLevel===0)&&pass.some(e=>e.phase==='delayed')&&([...ds].at(-1)>=[...ds][0]&&new Date([...ds].sort().at(-1))-new Date([...ds].sort()[0])>=7*86400000))return {label:'稳定打通',level:4};if(pass.length>=3&&ds.size>=2&&ms.size>=2&&!recent.some(e=>e.result==='wrong'))return {label:'基本打通',level:3};if(pass.length)return {label:'初步会',level:2};return {label:'接触过 · 待独立验证',level:1};}
function baseParent(){let p=profile(),i=mainIssue(),due=dueIssues();return `<div class="eyebrow">家长观察室</div><h1>看到进步，也看到下一步。</h1><p class="muted">每个结论都回到真实尝试。帮助后答对，与独立完成分别记录。</p><div class="card"><label>当前孩子</label><div class="row"><select id="profileSelect" onchange="switchProfile(this.value)">${db.profiles.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="secondary" onclick="addProfile()" style="white-space:nowrap">新增</button></div><p class="small muted">孩子的数据按独立 ID 保存；不会互相继承表现。</p><label>听音任务的声音来源</label><select onchange="setAudioSource(this.value)"><option value="synthesis" ${p.audioSource==='synthesis'?'selected':''}>真人音节录音 · 点击播放</option><option value="adult" ${p.audioSource==='adult'?'selected':''}>家长规范读音 · 每题确认</option></select><p class="small muted">使用 SReading 拼音教学表原站录音，声母、韵母及带调音节分别匹配，不使用字母语音合成。参考跟读不计正式掌握；听辨测评可选家长规范读音。录音、手写没有 AI 自动评分。<br><a href="https://www.sreading.org/zh-hans/pinyin-pathway" target="_blank" rel="noopener">拼音教学录音来源</a></p></div><div class="card"><h2>今天为什么练这个</h2><p>${i?'当前主修复：'+esc(i.label)+'。优先分为 '+i.priorityScore+'，今天只修复这一项。':'先探索认形、拼读和标调；零散错误先观察，不立即认定能力缺陷。'}</p><p class="muted">${due.length?'到期复测：'+due.map(x=>esc(x.label)).join('、')+'，安排在今天开头。':'复测由实际修复结果触发。当天不同材料独立通过后，下一天和后续间隔再验证。'}</p></div><h2>能力打通图</h2><div class="grid">${Object.entries(CAPABILITIES).map(([k,v])=>{let m=mastery(p,k);return `<div class="skill"><strong>${v}</strong><span class="small muted">${[...new Set(p.evidence.filter(e=>e.capability===k&&!e.demoScore).map(e=>e.knowledgeId))].slice(0,6).map(esc).join('、')||'未观察材料'}</span><br><span class="status ${m.level>=3?'green':m.label==='正在修复'?'orange':''}">${m.label}</span><div class="progress"><i style="width:${m.level*25}%"></i></div></div>`;}).join('')}</div><p class="small muted">图上状态仅覆盖已观察的材料，不能外推整类拼音。稳定打通需要多个材料、多个日期及延迟验证；未测不等于不会。</p><div class="card"><h2>卡点与复测</h2>${Object.values(p.issues).length?Object.values(p.issues).map(x=>`<div class="evidence"><b>${esc(x.label)}</b><p>${STATUS[x.status]} · 优先分 ${x.priorityScore}</p><p class="muted">独立错误 ${x.independentFailCount} · 独立正确 ${x.independentPassCount} · 受助正确 ${x.supportedPassCount}<br>${x.nextDue?'下次复测：'+x.nextDue:'暂无复测日期'} · 复发 ${x.reopenCount} 次</p></div>`).join(''):'<p class="muted">还没有真实错误记录。不会用模拟数据填充孩子的卡点。</p>'}<p class="small muted">错误标签是可观察的候选，不是对错误原因的确定诊断。一次错不升级；尚未提供的前置阻断证据不加分。</p></div><details class="card"><summary>＋ 我发现一个问题</summary><label>观察能力</label><select id="obsCap">${Object.entries(CAPABILITIES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label>观察目标</label><input id="obsTarget" placeholder="例如 bǎ"><label>错误标签（仅出错时）</label><select id="obsTag">${Object.entries(TAGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label>表现</label><select id="obsResult"><option value="unverified">尚不能判断</option><option value="wrong">错误</option><option value="correct">正确</option></select><label>帮助程度</label><select id="obsSupport">${['完全独立','重听一次','二选一','规则提示','成人示范'].map((s,n)=>`<option value="${n}">${s}</option>`).join('')}</select><label>具体事实</label><textarea id="obsNote" placeholder="写出孩子实际说了或写了什么"></textarea><button onclick="addObservation()">保存这条观察</button></details><details class="card"><summary>真实表现记录 · ${p.evidence.length} 条</summary>${p.evidence.slice(-30).reverse().map(e=>`<div class="evidence"><b>${esc(e.target)} · ${CAPABILITIES[e.capability]||esc(e.capability)}</b><p>${e.date} · ${{correct:'正确',wrong:'错误',exposed:'教学接触',skipped:'跳过',unverified:'未验证'}[e.result]} · 帮助 ${e.supportLevel} 级 · ${e.demoScore?'试听，不计掌握':e.source==='parent'?'家长观察':'网页作答'}</p><p class="muted">作答：${esc(e.selected)||'—'}${e.errorTag?' · 标签：'+esc(TAGS[e.errorTag]||e.errorTag):''}${e.note?'<br>'+esc(e.note):''}</p>${e.recordingURI?`<audio controls src="${e.recordingURI}"></audio>`:''}${e.handwriting?`<img src="${e.handwriting}" alt="这次手写记录" style="width:100%;border:1px solid #ddd">`:''}</div>`).join('')||'<p class="muted">完成冒险后，记录会出现在这里。</p>'}</details><div class="card"><h2>本地备份</h2><p class="muted">进度只在此浏览器。换设备前导出；录音和手写随进度备份，录音也可单独下载。</p><button onclick="exportProgress()">导出全部进度</button><label>导入进度（先预览，再确认）</label><input type="file" accept=".json,application/json" onchange="previewImport(this.files[0]);this.value=''">${storageError?'<p class="danger">'+esc(storageError)+'</p>':''}</div><details class="card"><summary>查看模拟闭环 · 不写入孩子进度</summary><p class="small muted">独立模拟对象，展示二三声卡点在不同日期的变化。</p><button onclick="showSimulation()">运行示例</button><div id="simulation"></div></details>`;}
function switchProfile(id){if(recording)return;db.activeId=id;taskState=null;save();render();}
function setAudioSource(value){profile().audioSource=value;save();toast('声音来源已更新，下一次播放生效。');}
function addProfile(){let d=dialog('<h2>新增小探险家</h2><label>昵称</label><input id="newName" maxlength="20" placeholder="给孩子一个昵称"><div class="row" style="margin-top:16px"><button id="add">建立独立进度</button><button id="cancel" class="quiet">取消</button></div>');d.querySelector('#add').onclick=()=>{let n=d.querySelector('#newName').value.trim();if(!n)return;let p=emptyProfile(n);db.profiles.push(p);db.activeId=p.id;save();d.close();render();};d.querySelector('#cancel').onclick=()=>d.close();}
function addObservation(){let target=document.getElementById('obsTarget').value.trim().slice(0,40),note=document.getElementById('obsNote').value.trim().slice(0,500);if(!target||!note){toast('请填写观察目标和具体事实。');return;}let e={evidenceId:uid(),profileId:profile().id,date:day(),timestamp:new Date().toISOString(),target,knowledgeId:stripTone(target),materialId:stripTone(target),capability:document.getElementById('obsCap').value,taskType:'parent_observation',phase:'observation',result:document.getElementById('obsResult').value,selected:note,expected:target,supportLevel:+document.getElementById('obsSupport').value,source:'parent',demoScore:!!profile().isDemo,errorTag:document.getElementById('obsTag').value,note};profile().evidence.push(e);if(['wrong','correct'].includes(e.result))updateDiagnosis(profile(),e);save();render();toast('观察已保存。');}
function exportProgress(){if(profile().isDemo){toast('模拟数据不能导出为真实进度，请先退出测试。');return;}downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'拼音进度-'+day()+'.json');}

function generateHandwriting(p){if(p.handwritingLog.some(h=>h.date===day()))return;let plan=p.dailyPlan[day()]||{},symbols=plan.newLearned.slice(0,2);if(!symbols.length)symbols=['b'];let candidates=symbols.map(target=>({kind:'copy',target,capability:'handwriting',instruction:'照着写 '+target+' · 1 次'}));let writingIssue=Object.values(p.issues).find(i=>['handwriting','dictation','toneMarking'].includes(i.capability)&&['active','repairing','reopened'].includes(i.status));let target=writingIssue?.relatedKnowledge.at(-1)||'shui';candidates.push({kind:'rule',target,capability:'toneMarking',instruction:'给 '+target+' 标第三声'});if(candidates.length<3)candidates.push({kind:'dictation',target:'ang',capability:'dictation',instruction:'听家长读音，写下来'});p.handwritingLog.push(...candidates.slice(0,5).map(c=>({...c,id:uid(),date:day(),result:null})));}

function mastery(p,c){let projection=p;if(c==='pronunciation')projection={...p,evidence:p.evidence.map(e=>e.capability==='recognition'&&e.source==='parent'&&e.taskType==='soundRead'?{...e,capability:'pronunciation'}:e)};if(c==='transfer')projection={...p,evidence:p.evidence.map(e=>e.transferMaterial?{...e,capability:'transfer'}:e)};let m=baseMastery(projection,c);let suspect=Object.values(p.issues).find(i=>i.capability===c&&i.status==='suspected_regression');if(suspect){let before={...p,evidence:p.evidence.filter(e=>e.timestamp<suspect.regressionStart),issues:Object.fromEntries(Object.entries(p.issues).filter(([k])=>k!==suspect.issueId))};let old=baseMastery(before,c);if(old.level===4)return {level:4,label:'稳定打通 · 偶发待验证'};}return m;}
function nodeDetail(cap){let p=profile(),m=mastery(p,cap),issues=Object.values(p.issues).filter(i=>i.capability===cap),events=p.evidence.filter(e=>e.capability===cap).slice(-8);let d=dialog(`<h2>${CAPABILITIES[cap]}</h2><p>${m.label}</p><p class="muted">${m.level===4?'已有跨材料、跨日期及延迟验证证据。':'未满足多材料、连续独立成功和延迟保持，暂不判稳定打通。'}</p>${issues.map(i=>`<p><b>${esc(i.label)}</b><br>${STATUS[i.status]}<br>建立依据：${esc(i.activationReason||'偶尔出错，先作为候选')}。独立错误 ${i.independentFailCount} 次，受助正确 ${i.supportedPassCount} 次。<br>下一动作：${i.nextDue?i.nextDue+' 用新材料无提示验证':'继续观察实际表现'}</p><button data-override="${i.issueId}">纠正这一判断</button>`).join('')}<details><summary>最近表现 ${events.length} 条</summary>${events.map(e=>'<p class="small">'+e.date+' '+esc(e.target)+' '+esc(e.result)+' · 帮助 '+e.supportLevel+'级'+(e.demoScore?' · Demo':'')+'</p>').join('')}</details><button onclick="this.closest('dialog').close()">返回能力图</button>`);d.querySelectorAll('[data-override]').forEach(b=>b.onclick=()=>{d.close();overrideIssue(b.dataset.override);});}

function bindParent(){let nodes=document.querySelectorAll('.grid .skill');let capGrid=[...document.querySelectorAll('h2')].find(e=>e.textContent==='能力打通图')?.nextElementSibling;if(capGrid)Array.from(capGrid.children).forEach((el,i)=>{let c=Object.keys(CAPABILITIES)[i];el.setAttribute('role','button');el.tabIndex=0;el.onclick=()=>nodeDetail(c);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')nodeDetail(c);};});let reset=document.getElementById('resetHold');if(reset){let timer;reset.onpointerdown=e=>{reset.setPointerCapture(e.pointerId);reset.textContent='继续按住 5 秒…';timer=setTimeout(()=>{reset.textContent='长按已完成';confirmReset();},5000);};reset.onpointerup=reset.onpointercancel=reset.onpointerleave=()=>{clearTimeout(timer);reset.textContent='长按 5 秒，重置当前孩子进度';};}}
function confirmReset(){let d=dialog('<h2>重置当前孩子？</h2><p>会清除当前孩子的作答、卡点、故事和本地录音。其他孩子保留。</p><div class="row"><button id="resetConfirm" class="danger">确认重置</button><button id="resetCancel">保留进度</button></div>');d.querySelector('#resetConfirm').onclick=()=>{let old=profile(),fresh=emptyProfile(old.name);fresh.id=old.id;db.profiles[db.profiles.indexOf(old)]=fresh;save();d.close();render();};d.querySelector('#resetCancel').onclick=()=>d.close();}

function finalEligibility(){let p=profile(),reading=new Set(p.evidence.filter(e=>['read','soundRead'].includes(e.taskType)&&e.result==='correct'&&e.supportLevel===0&&!e.demoScore&&VALID.has(stripTone(e.target))).map(e=>stripTone(e.target))).size;let required=['recognition','pronunciation','blending','toneListening','toneProduction','toneSymbolMapping','toneMarking','handwriting','dictation','discrimination','transfer'];let gaps=required.filter(c=>mastery(p,c).level!==4);let open=Object.values(p.issues).filter(i=>['active','repairing','reopened','monitoring','suspected_regression'].includes(i.status)&&i.priorityScore>=4);return {eligible:reading>=300&&!gaps.length&&!open.length,reading,gaps,open};}
function generateFinalTasks(){let pool=['ma','ba','pa','ta','da','na','la','mi','bi','pi','ti','di','ni','li','mu','bu','pu','tu','du','nu','lu','mo','bo','po','mei','bei','fei','gei','hei','lei','mai','bai','pai','tai','dai','nai','lai','mao','bao','pao','tao','dao','nao','lao','liu','gui','shui','xue','qiao','niu'];let tasks=pool.map((syllable,n)=>n<20?makeTask('read',syllable,n%4+1,'final'):n<30?makeTask('tone',syllable,n%4+1,'final'):n<40?makeTask('blending',syllable,1,'final'):n<45?makeTask('listening',['an','ang','en','eng','in'][n-40],1,'final'):makeTask('marking',syllable,3,'final'));tasks.slice(40,45).forEach(t=>t.capability='discrimination');tasks.forEach(t=>t.prompt='守护这颗星光，独立完成魔法');return tasks;}
function startFinal(){let gate=finalEligibility();if(!gate.eligible){dialog(`<h2>综合守护关 · 还在准备</h2><p>独立音节 ${gate.reading}/300</p><p class="muted">等待稳定：${gate.gaps.map(c=>CAPABILITIES[c]).join('、')||'已满足'}<br>高优先开放卡点：${gate.open.length} 个</p><p>先完成今天的冒险，星光会一点点积累。</p><button onclick="this.closest('dialog').close()">继续日常冒险</button>`);return;}if(currentSession()){toast('先完成当前冒险，再进入综合关。');return;}let d=dialog('<h2>综合守护关 · 50 个任务</h2><p>可分多次完成。每天仍最多 15 分钟，不要求一口气做完。</p><button id="beginFinal">开始守护</button>');d.querySelector('#beginFinal').onclick=()=>{profile().activeSession={id:uid(),date:day(),startedAt:new Date().toISOString(),tasks:generateFinalTasks(),index:0,elapsedMs:0,lastTick:Date.now(),final:true};save();d.close();view='task';render();};}
function finishFinal(session){let p=profile();if(session.index<session.tasks.length){session.lastTick=Date.now();view='home';save();return '<div class="card"><h2>今天先休息</h2><p>综合关已保存，下次从第 '+(session.index+1)+' 项继续。</p><button class="primary" onclick="setView(\'home\')">回到地图</button></div>';}let events=p.evidence.filter(e=>e.sessionId===session.id&&e.phase==='final'),groups={};for(let e of events){let g=groups[e.capability]||{total:0,pass:0};g.total++;if(e.result==='correct'&&e.supportLevel===0&&!e.demoScore)g.pass++;groups[e.capability]=g;}let pass=events.length===50&&events.filter(e=>e.result==='correct'&&e.supportLevel===0&&!e.demoScore).length>=45&&Object.values(groups).every(g=>g.pass/g.total>=.8);p.finalVerification={sessionId:session.id,date:day(),pass,groupResults:groups,evidenceIds:events.map(e=>e.evidenceId),pendingDelayedVerification:pass};p.activeSession=null;if(pass){p.finalDue=addDays(day(),1);award('comprehensive_pass','综合守护');}save();return '<div class="card"><h2>'+ (pass?'综合关通过，明天再守住星光':'这次探索已保存')+'</h2><p>未完成延迟保持前，不颁发最终通关徽章。各能力表现分别保留，不用总分掩盖集中困难。</p><button class="primary" onclick="setView(\'home\')">回到地图</button></div>';}
function evaluateFinalRetention(){let p=profile();if(!p.finalVerification?.pass||!p.finalDue||p.finalDue>day())return;let e=p.evidence.filter(e=>e.phase==='final_delayed'&&e.date>=p.finalDue&&!e.demoScore);if(e.length>=6&&e.every(x=>x.result==='correct'&&x.supportLevel===0)){p.finalVerification.pendingDelayedVerification=false;p.finalVerification.delayedPass=true;p.finalVerification.delayedEvidenceIds=e.map(x=>x.evidenceId);p.finalDue=null;award('pinyin_guardian','拼音魔法守护者');save();}}

let brandClicks=0;document.querySelector('.brand').onclick=()=>{brandClicks++;if(brandClicks>=5){brandClicks=0;developerPanel();}};
function developerPanel(){let d=dialog(`<h2>开发者测试 · 隔离环境</h2><p class="muted">测试日期只作用于模拟档案，真实进度不会改变。</p><div class="grid">${[0,1,2,4,7,15].map(n=>`<button data-days="${n}">${n===0?'今天':'+'+n+'天'}</button>`).join('')}</div><button id="seed" style="margin-top:16px">载入待次日复测的卡点</button><button id="exitDemo" class="quiet">退出测试，返回真实进度</button>`);d.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{enterDemo();simulatedDate=addDays(new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date()),+b.dataset.days);if(currentSession()&&currentSession().date!==day())profile().activeSession=null;save();d.close();view='parent';render();toast('模拟日期：'+day());});d.querySelector('#seed').onclick=()=>{enterDemo();seedDemo();d.close();view='parent';render();};d.querySelector('#exitDemo').onclick=()=>{if(realDB){db=realDB;realDB=null;}simulatedDate=null;storeKey=STORE;view='home';d.close();render();};}
function enterDemo(){if(realDB)return;realDB=db;let p=emptyProfile('模拟探险家');p.isDemo=true;db={version:2,profiles:[p],activeId:p.id};storeKey=STORE+'.developer';simulatedDate=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());}
function seedDemo(){let p=profile(),date=day();p.audioSource='adult';let run=(material,result,phase='learn')=>{let e={evidenceId:uid(),profileId:p.id,date,timestamp:new Date().toISOString(),target:applyToneMark(material,3),knowledgeId:material,materialId:material,capability:'toneListening',result,supportLevel:0,source:'web',demoScore:true,synthetic:true,errorTag:'tone_2_3_confusion',issueId:phase==='learn'?null:'tone_2_3_confusion',phase,taskType:'tone',validForMastery:true};p.evidence.push(e);updateDiagnosis(p,e);if(e.issueId)updateVerification(p,e);};run('ba','wrong');run('ba','wrong');p.issues.tone_2_3_confusion.status='repairing';run('ma','correct','verify');run('ta','correct','verify');p.issues.tone_2_3_confusion.status='monitoring';save();toast('模拟卡点已就绪：明天必须先复测。');}
// Render routes remain within one document.
function arrangeVisualLayout(){let main=document.getElementById('main');main.dataset.view=view;if(view!=='parent')return;main.querySelector('h1')?.classList.add('parent-overview');let intro=main.querySelector('h1');let summary=intro?.nextElementSibling;if(summary?.classList.contains('grid'))summary.classList.add('parent-summary');let scope=summary?.nextElementSibling;scope?.classList.add('parent-scope');let heading=[...main.querySelectorAll('h2')].find(e=>e.textContent==='能力打通图'),grid=heading?.nextElementSibling,note=grid?.nextElementSibling;grid?.classList.add('capability-grid');let settings=main.querySelector('#profileSelect')?.closest('.card');if(settings&&heading){let drawer=document.createElement('details');drawer.className='card account-drawer';let title=document.createElement('summary');title.textContent='孩子档案与声音设置';drawer.append(title);settings.before(drawer);drawer.append(settings);let position=scope||summary||intro;position.after(heading,grid,note);let observations=[...main.querySelectorAll('summary')].find(e=>e.textContent.includes('我发现一个问题'))?.closest('details');if(observations)observations.before(drawer);} }

render=function(){let main=document.getElementById('main');document.getElementById('modeBadge').textContent=profile().isDemo?'模拟 · '+day():'V2.3 · 拼音教学音';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===(['task','completion','handwriting'].includes(view)?'home':view)));main.innerHTML=view==='parent'?parent():view==='library'?library():view==='task'?task():view==='completion'?completion():view==='handwriting'?handwriting():home();let skin=THEMES[profile().theme]||THEMES.pony_adventure;main.innerHTML=main.innerHTML.replaceAll('星铃',skin.hero).replaceAll('🦄',skin.icon);arrangeVisualLayout();initCanvas();if(view==='parent')bindParent();};
Object.assign(window.PinyinDaily,{finalEligibility,generateFinalTasks,listeningChoices,coreRepairTasks,newMaterial,validImport,updateDiagnosis,mastery,evaluatePronunciation,reviewHandwriting,startAdventure,enterDemo,seedDemo,getDate:day,setTestDate:date=>{enterDemo();simulatedDate=date;save();},getDailyPlan:()=>profile().dailyPlan,exitDemo:()=>{if(realDB){db=realDB;realDB=null;}simulatedDate=null;storeKey=STORE;view='home';render();},isDemo:()=>!!profile().isDemo});

render();

const APP_RELEASE='20261004-teaching-audio-4';
function showRelease(){const badge=document.getElementById('modeBadge');if(badge&&!profile().isDemo)badge.textContent='V2.3 · 拼音教学音';}
let updateCheckBusy=false;
async function checkAppUpdate(){if(updateCheckBusy||location.protocol==='file:')return;updateCheckBusy=true;try{const url=new URL(location.href);url.searchParams.set('_release_check',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)return;const html=await response.text();const next=html.match(/name="app-release" content="([A-Za-z0-9-]+)"/)?.[1];if(!next||next===APP_RELEASE||document.getElementById('updateNotice'))return;window.speechSynthesis?.cancel();const notice=document.createElement('div');notice.id='updateNotice';notice.className='note';notice.innerHTML='<strong>网页已有新版</strong><p>先停止旧版发声，保存进度后更新。</p><button id="reloadLatest">保存并更新</button>';document.querySelector('.app').prepend(notice);notice.querySelector('button').onclick=()=>{if(recording){toast('请先结束录音，再更新。');return;}save();location.reload();};}catch(e){}finally{updateCheckBusy=false;}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAppUpdate();});
window.addEventListener('focus',checkAppUpdate);
setInterval(checkAppUpdate,60000);
showRelease();checkAppUpdate();
